<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Music Manager – Vorschau</title>
<style>
body{margin:0;background:#f3f5f7;color:#212121;font-family:Arial,sans-serif;--primary-color:#03a9f4;--ha-font-family-body:Arial,sans-serif;--primary-text-color:#212121;--secondary-text-color:#727272;--card-background-color:#fff;--secondary-background-color:#f5f5f5;--divider-color:#ddd}
body.dark{background:#11151b;color:#f1f3f5;--primary-text-color:#f1f3f5;--secondary-text-color:#afb7c1;--card-background-color:#1b222c;--secondary-background-color:#252e3a;--divider-color:#394451}
.demo-shell{max-width:1000px;margin:auto;padding:20px 12px}.demo-head{display:flex;align-items:center;gap:16px;justify-content:space-between;margin-bottom:20px}.demo-head h1{font-size:20px;margin:0}.demo-head p{font-size:13px;line-height:1.5}.demo-head button{border:0;border-radius:18px;padding:10px 16px;cursor:pointer}.demo-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,350px),1fr));gap:20px}#editor-host{margin-top:20px}#reference{display:none}
</style>
<div class="demo-shell"><header class="demo-head"><div><h1>Music Manager</h1><p>Interaktive Vorschau mit Beispieldaten.<br>Die Demo steuert keine echten Lautsprecher.</p></div><button id="theme">Hell / Dunkel</button></header><div class="demo-cards" id="cards"></div><div id="alarm-host"></div><div id="editor-host"></div><div id="reference"></div></div>
<script type="module" src="../custom_components/music_manager/frontend/music-manager-card.js"></script>
<script type="module">
await customElements.whenDefined('music-manager-card');
const ROOT='media-source://radio_browser';
const featureFlags=1|2|4|8|16|32|512|4096|16384|32768;
const station=(id,title)=>({title,media_content_id:ROOT+'/'+id,media_content_type:'audio/mpeg',can_play:true,can_expand:false});
const directory=(id,title)=>({title,media_content_id:ROOT+'/'+id,media_content_type:'music',can_play:false,can_expand:true});
const registry=[{entity_id:'media_player.wohnzimmer',platform:'sonos',unique_id:'RINCON_AABBCCDDEEFF01400'},{entity_id:'media_player.maximilian_sonos',platform:'sonos',unique_id:'RINCON_11223344556601400'},{entity_id:'media_player.ma_wohnzimmer',platform:'music_assistant',unique_id:'RINCON_AABBCCDDEEFF01400'},{entity_id:'media_player.ma_maximilian',platform:'music_assistant',unique_id:'RINCON_11223344556601400'},{entity_id:'media_player.tv',platform:'cast'},{entity_id:'media_player.disabled',platform:'sonos',disabled_by:'user'}];
let states={
 'media_player.wohnzimmer':{entity_id:'media_player.wohnzimmer',state:'playing',attributes:{friendly_name:'Sonos Wohnzimmer',media_title:'SWR3',media_artist:'Live-Radio',volume_level:0.28,is_volume_muted:false,supported_features:featureFlags}},
 'media_player.maximilian_sonos':{entity_id:'media_player.maximilian_sonos',state:'paused',attributes:{friendly_name:'Sonos Maximilian',media_title:'Musik in Maximilians Zimmer',media_artist:'Sonos-Warteschlange',volume_level:0.18,is_volume_muted:false,supported_features:featureFlags}},
 'media_player.tv':{entity_id:'media_player.tv',state:'idle',attributes:{friendly_name:'Fernseher',supported_features:featureFlags}}
};
for(const [entity,title] of [['media_player.ma_wohnzimmer','Sonos Wohnzimmer'],['media_player.ma_maximilian','Sonos Maximilian']])states[entity]={entity_id:entity,state:'idle',attributes:{friendly_name:title,volume_level:0.28,supported_features:featureFlags}};
const calls=[],wsCalls=[];
let failService=false,failBrowse=false,canSearch=true,wsHook=null,serviceHook=null;
const cards=[],alarmRows=[],alarmSelections=new Map();let failAlarmSave=false;
let currentUser='manuel',failFavorites=false;
const favoriteData=new Map(),favoriteSubscribers=new Map(),alarmSongData=new Map(),alarmSongSubscribers=new Map(),connections=new Map();
const dataForKey=key=>key==='music_manager_alarm_songs'?alarmSongData:favoriteData;
const subscribersForKey=key=>key==='music_manager_alarm_songs'?alarmSongSubscribers:favoriteSubscribers;
const notifyAlarmSongs=user=>{for(const cb of alarmSongSubscribers.get(user)||[])cb({value:alarmSongData.get(user)||[]});};
const notifyFavorites=user=>{for(const cb of favoriteSubscribers.get(user)||[])cb({value:favoriteData.get(user)||[]});};
const connectionFor=user=>{
 if(!connections.has(user))connections.set(user,{async subscribeMessage(cb,message){
  if(failFavorites)throw new Error('Favoriten nicht verfügbar');
  const subscribers=subscribersForKey(message.key),data=dataForKey(message.key);
  if(!subscribers.has(user))subscribers.set(user,new Set());
  subscribers.get(user).add(cb);cb({value:data.get(user)||[]});
  return ()=>subscribers.get(user).delete(cb);
 }});
 return connections.get(user);
};

const navigationData=new Map();
const makeHass=(user=currentUser)=>({user:{id:user},connection:connectionFor(user),states,entities:Object.fromEntries(registry.map(e=>[e.entity_id,e])),
 async callService(domain,service,data){
  calls.push({domain,service,data});
  if(serviceHook)await serviceHook(domain,service,data);
  if(failService)throw new Error('Nicht berechtigt oder Sonos nicht erreichbar');
  const entity=data.entity_id, old=states[entity];
  const changes=service==='play_media'?{state:'playing',attributes:{media_content_id:data.media_content_id,media_channel:data.extra?.title||'Radio',media_title:data.extra?.title||'Radio',media_artist:null,media_duration:null}}:service==='media_pause'?{state:'paused'}:service==='media_stop'?{state:'idle'}:service==='media_play'?{state:'playing'}:service==='volume_set'?{attributes:{volume_level:data.volume_level}}:service==='volume_mute'?{attributes:{is_volume_muted:data.is_volume_muted}}:service==='shuffle_set'?{attributes:{shuffle:data.shuffle}}:service==='media_seek'?{attributes:{media_position:data.seek_position,media_position_updated_at:new Date().toISOString()}}:{};
  states={...states,[entity]:{...old,...changes,attributes:{...old.attributes,...changes.attributes}}};
  push();
 },
 async callWS(msg){
  wsCalls.push({...msg});
  if(wsHook){const result=await wsHook(msg);if(result!==undefined)return result;}
  if(msg.type==='config/entity_registry/list')return registry;
   if(msg.type==='music_manager/player_navigation'){
    const can_select=['manuel','vera'].includes(user),key=msg.navigation_id||msg.source_entity;
    if(!can_select&&msg.action==='select')throw new Error('Box festgelegt');
    const players=can_select?registry.filter(e=>e.platform==='sonos'&&!e.disabled_by&&states[e.entity_id]).map(e=>({entity_id:e.entity_id,name:states[e.entity_id].attributes.friendly_name,available:true})):[];
    if(!navigationData.has(user))navigationData.set(user,{});
    if(msg.action==='select'){if(!players.some(p=>p.entity_id===msg.entity_id))throw new Error('Box nicht verfügbar');navigationData.get(user)[key]=msg.entity_id;}
    return {can_select,players,show_alarm_songs:['maximilian','paul'].includes(user),entity_id:can_select?navigationData.get(user)[key]||msg.source_entity:msg.source_entity};
   }
   if(msg.type==='frontend/get_user_data'){if(failFavorites)throw new Error('Favoriten nicht verfügbar');return {value:dataForKey(msg.key).get(user)||[]};}
   if(msg.type==='frontend/set_user_data'){if(failFavorites)throw new Error('Speichern verweigert');dataForKey(msg.key).set(user,msg.value);(msg.key==='music_manager_alarm_songs'?notifyAlarmSongs:notifyFavorites)(user);return null;}

  if(msg.type==='music_manager/alarm'){
   if(msg.alarm_id!=='school_alarm')throw new Error('Wecker unter Konfigurieren zuordnen.');
   if(!['manuel','maximilian'].includes(user))throw new Error('Dieser Wecker gehört einem anderen Benutzer.');
   const favorites=(alarmSongData.get('maximilian')||[]).filter(f=>f.kind==='apple_music'&&f.media_type==='track').map(({uri,title,media_type})=>({uri,title,media_type}));
   if(msg.action==='select'){
    if(failAlarmSave)throw new Error('Speichern fehlgeschlagen');
    const selected=favorites.find(f=>f.uri===msg.uri);if(msg.uri&&!selected)throw new Error('Ungültiger Favorit');
    alarmSelections.set(msg.alarm_id,selected||null);
   }
   const selection=alarmSelections.get(msg.alarm_id)||null;
   return {alarm_id:msg.alarm_id,owner:'Maximilian',source:'Sonos Maximilian',selection,favorites,in_favorites:!selection||favorites.some(f=>f.uri===selection.uri)};
  }
  if(msg.type==='music_manager/apple_music'){
   const target=msg.entity_id||(msg.source_entity==='media_player.wohnzimmer'?'media_player.ma_wohnzimmer':'media_player.ma_maximilian');
   if(msg.action==='status')return {account:user==='manuel'?'Manuel (Beispielkonto)':'Maximilian (Beispielkonto)',provider:'Apple Music',entity_id:target};
   if(msg.action==='play'){update(msg.source_entity,{state:'playing',attributes:{media_content_id:'http://music-assistant.example:8095/flow/session/example-queue/item/player.aac',media_channel:'Music Assistant',media_title:'Music Assistant',media_duration:null}});update(target,{state:'playing',attributes:{active_queue:'example-queue',media_content_id:msg.uri,media_title:'Apple Music – Beispieltitel',media_artist:'Beispielinterpret',media_duration:240,media_position:35,media_position_updated_at:new Date().toISOString(),shuffle:false}});return {started:true};}
   if(msg.action==='tracks')return {items:[{uri:'apple_music--demo://track/from-'+msg.uri.split('://')[1].split('/')[0]+'-'+(msg.offset||0),title:'Lied aus '+(msg.uri.includes('/album/')?'dem Album':'der Playlist'),media_type:'track',description:'Beispielinterpret · Titel'}],more:false};
   if(msg.action==='next'){update(target,{attributes:{media_content_id:'apple_music--demo://track/next',media_title:'Nächster Beispieltitel',media_position:0,media_position_updated_at:new Date().toISOString()}});return {skipped:true};}
   const type=msg.action==='search'?'track':msg.media_type;
   return {items:[{uri:'apple_music--demo://'+type+'/123',title:msg.action==='search'?'Beispieltitel: '+msg.query:type==='playlist'?'Meine Lieblingsmusik':type==='album'?'Mein Lieblingsalbum':'Mein Lieblingstitel',description:{track:'Titel',album:'Album',playlist:'Playlist'}[type],media_type:type}],more:false};
  }
  if(failBrowse)throw new Error('Radio Browser nicht geladen');
  if(msg.type==='media_source/search_media')return {result:msg.search_query==='leer'?[]:[station('swr3','SWR3'),station('rock','Rock Antenne – sehr langer Sendername für die mobile Ansicht')]};
  if(msg.type==='media_source/browse_media'){
   const id=msg.media_content_id;
   return {title:'Radio Browser',can_search:canSearch,children:id===ROOT?[directory('popular','Popular'),directory('tag','By Category'),directory('language','By Language'),directory('local','Local stations'),directory('country/DE','Germany')]:id.endsWith('/tag')?[directory('tag/rock','Rock'),directory('tag/jazz','Jazz')]:id.endsWith('/language')?[directory('language/german','Deutsch')]:[station('swr3','SWR3'),station('rock','Rock Antenne – sehr langer Sendername für die mobile Ansicht')]};
  }
  throw new Error('Unbekannte Websocket-Aktion '+msg.type);
 }});
function push(){for(const row of alarmRows)row.hass=makeHass();for(const card of cards)card.hass=makeHass();}
function addCard(entity,name,controls){const card=document.createElement('music-manager-card');card.setConfig({type:'custom:music-manager-card',entity,name,controls});document.querySelector('#cards').append(card);cards.push(card);card.hass=makeHass();return card;}
function update(entity,changes){const old=states[entity];states={...states,[entity]:{...old,...changes,attributes:{...old?.attributes,...changes.attributes}}};push();}
function addAlarmRow(){const row=document.createElement('music-manager-alarm-row');row.setConfig({alarm_id:'school_alarm',name:'Weckmusik'});const host=document.querySelector('#alarm-host');host.style.cssText='margin-top:20px;max-width:500px;padding:16px;border:1px solid var(--divider-color,#ddd);border-radius:12px;background:var(--card-background-color,#fff)';host.append(row);alarmRows.push(row);row.hass=makeHass();return row;}
function addBeta(entity='media_player.wohnzimmer',config={}){if(entity==='media_player.wohnzimmer'&&!states[entity].attributes.media_content_id)update(entity,{attributes:{media_content_id:ROOT+'/swr3',media_channel:'SWR3'}});const card=document.createElement('music-manager-beta-card');card.setConfig({entity,...config});document.querySelector('#cards').append(card);cards.push(card);card.hass=makeHass();return card;}
window.demo={navigationData,addBeta,cards,calls,wsCalls,registry,makeHass,alarmSongData,addCard,addAlarmRow,alarmRows,alarmSelections,set failAlarmSave(v){failAlarmSave=v},push,update,station,directory,
 switchUser(user){currentUser=user;push();},seedAlarmSongs(user,items){alarmSongData.set(user,structuredClone(items));notifyAlarmSongs(user);},seedFavorites(user,items){favoriteData.set(user,items);notifyFavorites(user);},get favoriteData(){return favoriteData},set failFavorites(v){failFavorites=v},
 set failService(v){failService=v},set failBrowse(v){failBrowse=v},set canSearch(v){canSearch=v},set wsHook(v){wsHook=v},set serviceHook(v){serviceHook=v},get states(){return states}};
addCard('media_player.wohnzimmer','Music Manager');
addCard('media_player.maximilian_sonos','Musik Maximilian');
document.querySelector('#theme').onclick=()=>document.body.classList.toggle('dark');
</script></html>
