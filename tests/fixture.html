<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Music Manager – Vorschau</title>
<style>
body{margin:0;background:#f3f5f7;color:#212121;font-family:Arial,sans-serif;--primary-color:#03a9f4;--ha-font-family-body:Arial,sans-serif;--primary-text-color:#212121;--secondary-text-color:#727272;--card-background-color:#fff;--secondary-background-color:#f5f5f5;--divider-color:#ddd}
body.dark{background:#11151b;color:#f1f3f5;--primary-text-color:#f1f3f5;--secondary-text-color:#afb7c1;--card-background-color:#1b222c;--secondary-background-color:#252e3a;--divider-color:#394451}
.demo-shell{max-width:1000px;margin:auto;padding:20px 12px}.demo-head{display:flex;align-items:center;gap:16px;justify-content:space-between;margin-bottom:20px}.demo-head h1{font-size:20px;margin:0}.demo-head p{font-size:13px;line-height:1.5}.demo-head button{border:0;border-radius:18px;padding:10px 16px;cursor:pointer}.demo-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,350px),1fr));gap:20px}#editor-host{margin-top:20px}#reference{display:none}
</style>
<div class="demo-shell"><header class="demo-head"><div><h1>Music Manager</h1><p>Interaktive Vorschau mit Beispieldaten.<br>Die Demo steuert keine echten Lautsprecher.</p></div><button id="theme">Hell / Dunkel</button></header><div class="demo-cards" id="cards"></div><div id="editor-host"></div><div id="reference"></div></div>
<script type="module" src="../dist/music-manager-card.js"></script>
<script type="module">
await customElements.whenDefined('music-manager-card');
const ROOT='media-source://radio_browser';
const featureFlags=1|4|8|16|32|512|4096|16384;
const station=(id,title)=>({title,media_content_id:ROOT+'/'+id,media_content_type:'audio/mpeg',can_play:true,can_expand:false});
const directory=(id,title)=>({title,media_content_id:ROOT+'/'+id,media_content_type:'music',can_play:false,can_expand:true});
const registry=[{entity_id:'media_player.wohnzimmer',platform:'sonos'},{entity_id:'media_player.maximilian_sonos',platform:'sonos'},{entity_id:'media_player.tv',platform:'cast'},{entity_id:'media_player.disabled',platform:'sonos',disabled_by:'user'}];
let states={
 'media_player.wohnzimmer':{entity_id:'media_player.wohnzimmer',state:'playing',attributes:{friendly_name:'Sonos Wohnzimmer',media_title:'SWR3',media_artist:'Live-Radio',volume_level:0.28,is_volume_muted:false,supported_features:featureFlags}},
 'media_player.maximilian_sonos':{entity_id:'media_player.maximilian_sonos',state:'paused',attributes:{friendly_name:'Sonos Maximilian',media_title:'Musik in Maximilians Zimmer',media_artist:'Sonos-Warteschlange',volume_level:0.18,is_volume_muted:false,supported_features:featureFlags}},
 'media_player.tv':{entity_id:'media_player.tv',state:'idle',attributes:{friendly_name:'Fernseher',supported_features:featureFlags}}
};
const calls=[],wsCalls=[];
let failService=false,failBrowse=false,canSearch=true,wsHook=null,serviceHook=null;
const cards=[];
const makeHass=()=>({states,entities:Object.fromEntries(registry.map(e=>[e.entity_id,e])),
 async callService(domain,service,data){
  calls.push({domain,service,data});
  if(serviceHook)await serviceHook(domain,service,data);
  if(failService)throw new Error('Nicht berechtigt oder Sonos nicht erreichbar');
  const entity=data.entity_id, old=states[entity];
  const changes=service==='play_media'?{state:'playing',attributes:{media_title:data.extra?.title||'Radio'}}:service==='media_pause'?{state:'paused'}:service==='media_stop'?{state:'idle'}:service==='media_play'?{state:'playing'}:service==='volume_set'?{attributes:{volume_level:data.volume_level}}:service==='volume_mute'?{attributes:{is_volume_muted:data.is_volume_muted}}:{};
  states={...states,[entity]:{...old,...changes,attributes:{...old.attributes,...changes.attributes}}};
  push();
 },
 async callWS(msg){
  wsCalls.push({...msg});
  if(wsHook){const result=await wsHook(msg);if(result!==undefined)return result;}
  if(msg.type==='config/entity_registry/list')return registry;
  if(failBrowse)throw new Error('Radio Browser nicht geladen');
  if(msg.type==='media_source/search_media')return {result:msg.search_query==='leer'?[]:[station('swr3','SWR3'),station('rock','Rock Antenne – sehr langer Sendername für die mobile Ansicht')]};
  if(msg.type==='media_source/browse_media'){
   const id=msg.media_content_id;
   return {title:'Radio Browser',can_search:canSearch,children:id===ROOT?[directory('popular','Popular'),directory('tag','By Category'),directory('language','By Language'),directory('local','Local stations'),directory('country/DE','Germany')]:id.endsWith('/tag')?[directory('tag/rock','Rock'),directory('tag/jazz','Jazz')]:id.endsWith('/language')?[directory('language/german','Deutsch')]:[station('swr3','SWR3'),station('rock','Rock Antenne – sehr langer Sendername für die mobile Ansicht')]};
  }
  throw new Error('Unbekannte Websocket-Aktion '+msg.type);
 }});
function push(){for(const card of cards)card.hass=makeHass();}
function addCard(entity,name,controls){const card=document.createElement('music-manager-card');card.setConfig({type:'custom:music-manager-card',entity,name,controls});document.querySelector('#cards').append(card);cards.push(card);card.hass=makeHass();return card;}
function update(entity,changes){const old=states[entity];states={...states,[entity]:{...old,...changes,attributes:{...old?.attributes,...changes.attributes}}};push();}
window.demo={cards,calls,wsCalls,registry,makeHass,addCard,push,update,station,directory,
 set failService(v){failService=v},set failBrowse(v){failBrowse=v},set canSearch(v){canSearch=v},set wsHook(v){wsHook=v},set serviceHook(v){serviceHook=v},get states(){return states}};
addCard('media_player.wohnzimmer','Music Manager');
addCard('media_player.maximilian_sonos','Musik Maximilian');
document.querySelector('#theme').onclick=()=>document.body.classList.toggle('dark');
</script></html>
