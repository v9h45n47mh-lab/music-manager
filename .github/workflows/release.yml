name: Release Music Manager
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: python3 scripts/package.py
      - uses: softprops/action-gh-release@v2
        with:
          name: Music Manager 1.0.0
          body_path: RELEASE_NOTES.md
          files: |
            dist/music-manager-card.js
            dist/LICENSES.txt
            ../Music-Manager-1.0.0.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-layouts-release
          path: test-results/
